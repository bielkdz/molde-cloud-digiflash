name: Publicar no Firebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: firebase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_MICROSOFT_CLIENT_ID: "${{ vars.VITE_MICROSOFT_CLIENT_ID }}"
      - name: Autenticar prévia temporária
        if: github.event_name == 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOLDES_CLOUD_DIGIFLASH }}"
      - name: Publicar prévia temporária do pull request
        if: github.event_name == 'pull_request'
        id: preview
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          npx firebase-tools hosting:channel:deploy liquid-glass-pr-50 --expires 1d --project moldes-cloud-digiflash --json | tee firebase-preview.json
          PREVIEW_URL=$(jq -r '.. | .url? // empty' firebase-preview.json | grep 'web.app' | head -n 1)
          test -n "$PREVIEW_URL"
          gh pr comment "${{ github.event.pull_request.number }}" --body "Prévia temporária do Liquid Glass: $PREVIEW_URL"
      - uses: google-github-actions/auth@v2
        if: github.event_name == 'push'
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOLDES_CLOUD_DIGIFLASH }}"
      - run: npx firebase-tools deploy --only firestore:rules --project moldes-cloud-digiflash
        if: github.event_name == 'push'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: github.event_name == 'push'
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOLDES_CLOUD_DIGIFLASH }}"
          channelId: live
          projectId: moldes-cloud-digiflash
